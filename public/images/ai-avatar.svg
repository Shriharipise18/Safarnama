<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Circular Background -->
  <circle cx="50" cy="50" r="48" fill="#4f46e5" />
  <!-- Glow Effect -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="10 5" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="10s" repeatCount="indefinite" />
  </circle>
  <!-- Bot Face -->
  <path d="M30 40 Q50 30 70 40 Q75 55 70 70 Q50 80 30 70 Q25 55 30 40" fill="white" />
  <!-- Eyes -->
  <circle cx="42" cy="52" r="4" fill="#4f46e5" />
  <circle cx="58" cy="52" r="4" fill="#4f46e5" />
  <!-- Smile -->
  <path d="M42 62 Q50 67 58 62" stroke="#4f46e5" stroke-width="2" fill="none" stroke-linecap="round" />
  <!-- Antennas -->
  <line x1="50" y1="30" x2="50" y2="20" stroke="white" stroke-width="3" stroke-linecap="round" />
  <circle cx="50" cy="18" r="4" fill="#0ea5e9" />
</svg>
